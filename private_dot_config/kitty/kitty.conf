background_opacity          0.95
cursor_trail                1
custom_shaders cursor-trail-motion-blur

font_family                 family="Cascadia Mono"

cursor_shape                block
cursor_blink_interval       0
shell_integration           no-cursor

tab_bar_style               separator

# Approximates herdr's double-click tokens, which aren't configurable.
select_by_word_characters   @-./_~?&=%+#:$*^\

clear_all_shortcuts         yes
clear_all_mouse_actions     yes

map ctrl+c copy_and_clear_or_interrupt
map ctrl+v paste_from_clipboard
map esc combine : clear_selection : send_key esc

# Herdr can't bind page keys, so send it chords it can bind.
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+page_down send_key ctrl+tab
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+page_up send_key ctrl+shift+tab
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+page_down send_key ctrl+shift+.
map --when-focus-on "cmdline:^herdr$ or cmdline:/herdr$" ctrl+shift+page_up send_key ctrl+shift+,

map --new-mode prefix --on-action end --on-unknown end ctrl+shift+a
map --mode prefix t new_tab
map --mode prefix w close_tab
map --mode prefix tab next_tab
map --mode prefix page_down next_tab
map --mode prefix shift+tab previous_tab
map --mode prefix page_up previous_tab
map --mode prefix shift+page_down move_tab_forward
map --mode prefix shift+page_up move_tab_backward
map --mode prefix 1 goto_tab 1
map --mode prefix 2 goto_tab 2
map --mode prefix 3 goto_tab 3
map --mode prefix 4 goto_tab 4
map --mode prefix 5 goto_tab 5
map --mode prefix 6 goto_tab 6
map --mode prefix 7 goto_tab 7
map --mode prefix 8 goto_tab 8
map --mode prefix 9 goto_tab 9
map --mode prefix shift+t set_tab_title
map --mode prefix p command_palette
map --mode prefix plus change_font_size all +2.0
map --mode prefix minus change_font_size all -2.0
map --mode prefix 0 change_font_size all 0
map --mode prefix delete clear_terminal reset active
map --mode prefix s kitty_shell window
map --mode prefix r load_config_file

mouse_map left press ungrabbed mouse_selection normal
mouse_map left doublepress ungrabbed mouse_selection word
mouse_map left triplepress ungrabbed mouse_selection line
mouse_map alt+left press ungrabbed mouse_selection rectangle
mouse_map ctrl+left press ungrabbed discard_event
mouse_map ctrl+left release ungrabbed mouse_handle_click link
mouse_map shift+left press grabbed mouse_selection normal
mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word
mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line
mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle
